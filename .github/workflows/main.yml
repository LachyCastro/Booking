name: Etiquetar PRs Automáticamente

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  etiquetar:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Obtener información del PR
        uses: actions/github-script@v7
        id: pr_info
        with:
          script: |
            const baseRef = context.payload.pull_request.base.ref;
            let label = '';
            if (baseRef === 'main') {
              label = 'hotfix';
            } else if (baseRef === 'hotfix') {
              label = 'hotfix';
            } else if (baseRef === 'staging') {
              label = 'fix';
            } else if (baseRef === 'develop') {
              label = 'feature';
            }
            core.setOutput('label', label);
            core.setOutput('base_ref', baseRef);

      - name: Añadir etiqueta al PR
        uses: actions/github-script@v7
        if: steps.pr_info.outputs.label != ''
        with:
          script: |
            const label = '${{ steps.pr_info.outputs.label }}';
            const baseRef = '${{ steps.pr_info.outputs.base_ref }}';
            console.log(`Añadiendo etiqueta '${label}' al PR con rama base '${baseRef}'`);
            await github.rest.issues.addLabels({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: [label]
            });

      - name: Remover etiqueta 'fix' si la rama base es 'hotfix'
        uses: actions/github-script@v7
        if: steps.pr_info.outputs.base_ref == 'hotfix' && steps.pr_info.outputs.label != 'hotfix' && steps.pr_info.outputs.label == 'fix'
        with:
          script: |
            console.log(`Removiendo etiqueta 'fix' del PR con rama base 'hotfix'`);
            await github.rest.issues.removeLabels({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'fix'
            });
